<!--Crie uma página que verifique se um número é primo. O usuário deve inserir um número e a página deve exibir se ele é primo ou não.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Número Primo</title>
</head>
<body>
    <h1>Verificar se um número é primo</h1>
    <p>Digite um número:</p>

    <input type="number" id="numero" placeholder="Digite um número">
    <button id="botao" onclick="verificarPrimo()">Verificar</button>
    <p id="resultado"></p>

    <script>
        function verificarPrimo() {
            const numero = parseInt(document.getElementById('numero').value)

            if(numero < 2) return document.getElementById('resultado').innerText = `${numero} não é primo.`

            for(let i =2; i < numero; i++){
                if(numero % i === 0) {
                    document.getElementById('resultado').innerText = `${numero} não é primo.`
                    return
                }
            }
            document.getElementById('resultado').innerText = `${numero} é primo.`
        }
    </script>
</body>
</html>
