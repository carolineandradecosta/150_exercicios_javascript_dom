<!--Crie uma página que calcule a média de quatro notas inseridas pelo usuário. Exiba se o aluno foi aprovado (média >= 7) ou reprovado (média < 7).-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Média Aluno</title>
</head>
<body>
        <h1>Calcula média de alunos</h1>
        <p>Digite as 4 notas:</p>
   
        <input type="number" id="nota1" placeholder="Nota 1"><br>
        <input type="number" id="nota2" placeholder="Nota 2"><br>
        <input type="number" id="nota3" placeholder="Nota 3"><br>
        <input type="number" id="nota4" placeholder="Nota 4"><br>
        <button id="botao" onclick="calcularMedia()">Calcular</button>
        <p id="resultado"></p>

    <script>
        function calcularMedia(){
        const nota1 = parseFloat(document.getElementById('nota1').value)
        const nota2 = parseFloat(document.getElementById('nota2').value)
        const nota3 = parseFloat(document.getElementById('nota3').value)
        const nota4 = parseFloat(document.getElementById('nota4').value)
        
        const media = ((nota1 + nota2 + nota3 + nota4) / 4).toFixed(2)
        const status = media >= 7 ? "Aprovado" : "Reprovado"
        document.getElementById('resultado').innerText = `Média: ${media} - ${status}`
        }
    </script>
</body>
</html>
